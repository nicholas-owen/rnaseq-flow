name: checks

# Every defect found in the v1.8.0 review was in code that had never executed.
# The static checks below catch arity and report errors without running
# anything; the stub run executes the whole channel graph with empty inputs and
# then asserts the result directories exist, because the symptom of the worst of
# those defects was a green run with no results in it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Pinned to the version the pipeline is developed and tested against, rather
  # than tracking latest. nextflowVersion in the manifest sets the floor at
  # 25.10 for the strict config parser; this pins the ceiling too, so a CI
  # failure means the pipeline changed and not that Nextflow did.
  NXF_VER: 26.04.6

defaults:
  run:
    # Named explicitly, this is `bash --noprofile --norc -eo pipefail {0}`. The
    # implicit default on Linux is `bash -e {0}`, with no pipefail, and the
    # GitHub docs said otherwise until github/docs#18934 corrected them.
    #
    # Four steps below pipe nextflow into tee, and a pipeline's exit status is
    # its last command's. Without pipefail that status is tee's, which is always
    # zero: the two negative tests then run their failure branch on a pipeline
    # that refused exactly as intended, and the positive ones cannot see a
    # Nextflow crash at all, only the grep that follows.
    shell: bash

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # check_report.py parses the report's R chunks with Rscript and reports a
      # missing Rscript as a failure rather than skipping, so a green job means
      # all five of its checks actually ran.
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core

      - name: Channel topology and process arity
        run: python tests/validate_topology.py

      - name: Report, R and module checks
        run: python tests/check_report.py

  stub:
    name: stub run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # Needs Nextflow but no data: rmatsLibType() is a pure function over a
      # list, and the mapping it holds is the one place where a transposed
      # value runs to completion and reports wrong PSI (B1).
      # The ./ is required: a script path with a slash in it is read as a
      # <owner>/<repo> project name, and nextflow goes to GitHub for it.
      - name: Unit test rmatsLibType()
        run: nextflow run ./tests/unit_rmats_libtype.nf

      - name: Build stub inputs
        run: bash tests/stub_fixtures.sh "$RUNNER_TEMP/fixtures"

      # No container engine on purpose. A stub run still containerises its task
      # if an engine is enabled, which would pull around thirty images to run
      # `mkdir` and `touch`. checkParameters() exempts stub runs from the
      # engine requirement for exactly this reason.
      - name: Genome route (STAR)
        run: |
          nextflow run main.nf -profile test -stub-run \
            --input      "$RUNNER_TEMP/fixtures/samplesheet.csv" \
            --aligner    star \
            --star_index "$RUNNER_TEMP/fixtures/star_index" \
            --gtf        "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
            --outdir     "$RUNNER_TEMP/out_star"

      # The assertions are the point. A missing result directory is what a
      # silently skipped analysis looks like, and it is invisible in the run
      # log: the run that prompted this exited 0 with no differential
      # expression in it and said nothing.
      - name: Genome route produced every result directory
        run: |
          for d in fastqc fastp star rseqc bam_to_bigwig featurecounts \
                   deseq2_output edger_output rmats_output gprofiler_output \
                   multiqc quarto_report pipeline_info; do
            if [ ! -d "$RUNNER_TEMP/out_star/$d" ]; then
              echo "missing: $d"
              ls -1 "$RUNNER_TEMP/out_star"
              exit 1
            fi
            echo "ok: $d"
          done

      - name: Pseudo-aligner route (Salmon)
        run: |
          nextflow run main.nf -profile test -stub-run \
            --input        "$RUNNER_TEMP/fixtures/samplesheet.csv" \
            --aligner      salmon \
            --salmon_index "$RUNNER_TEMP/fixtures/salmon_index" \
            --gtf          "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
            --outdir       "$RUNNER_TEMP/out_salmon"

      - name: Pseudo-aligner route produced every result directory
        run: |
          for d in fastqc fastp salmon tximport deseq2_output edger_output \
                   gprofiler_output multiqc quarto_report pipeline_info; do
            if [ ! -d "$RUNNER_TEMP/out_salmon/$d" ]; then
              echo "missing: $d"
              ls -1 "$RUNNER_TEMP/out_salmon"
              exit 1
            fi
            echo "ok: $d"
          done

      # Without --gtf there is no gene annotation, so featureCounts, rMATS and
      # therefore differential expression cannot run. The run should say so and
      # skip, not exit 0 with empty output and no message. run_de followed
      # nothing but the aligner name until 2026-10-29.
      #
      # HISAT2 rather than STAR: STAR is handed the annotation as --sjdbGTFfile,
      # so --gtf is mandatory there and checkParameters() now refuses it up
      # front. HISAT2 needs no GTF to align, which makes it the only route where
      # a GTF-less run is a legitimate thing to skip cleanly.
      - name: No GTF skips differential expression and says so
        run: |
          nextflow run main.nf -profile test -stub-run \
            --input        "$RUNNER_TEMP/fixtures/samplesheet.csv" \
            --aligner      hisat2 \
            --hisat2_index "$RUNNER_TEMP/fixtures/hisat2_index" \
            --outdir       "$RUNNER_TEMP/out_nogtf" \
            -ansi-log false 2>&1 | tee nogtf.log
          grep -q "needs --gtf" nogtf.log
          if [ -d "$RUNNER_TEMP/out_nogtf/deseq2_output" ]; then
            echo "deseq2_output exists on a run that cannot do differential expression"
            exit 1
          fi

      # The mirror of the above: STAR cannot align without an annotation, so it
      # must refuse by name rather than failing inside file() with "Argument of
      # `file()` function cannot be null", which names neither the parameter nor
      # the aligner.
      - name: STAR without a GTF is refused by name
        run: |
          if nextflow run main.nf -profile test -stub-run \
               --input      "$RUNNER_TEMP/fixtures/samplesheet.csv" \
               --aligner    star \
               --star_index "$RUNNER_TEMP/fixtures/star_index" \
               --outdir     "$RUNNER_TEMP/out_stargtf" \
               -ansi-log false 2>&1 | tee stargtf.log; then
            echo "STAR ran with no annotation to give --sjdbGTFfile"
            exit 1
          fi
          grep -q "requires --gtf" stargtf.log

      # A paired-end glob has to be recognised as paired. The commonest such
      # pattern, /data/*_R{1,2}.fastq.gz, has exactly one asterisk, and the
      # pattern-counting heuristic this replaced read that as single-end and
      # aligned each mate as its own sample. The fixtures hold four paired
      # samples, so four FASTQC tasks is right and eight means the pairing was
      # lost. Quoted so the shell passes the pattern through to Nextflow.
      - name: Paired-end glob input is read as paired
        run: |
          n=$(nextflow run main.nf -profile test -stub-run \
                --input      "$RUNNER_TEMP/fixtures/reads/*_{1,2}.fastq.gz" \
                --aligner    star \
                --star_index "$RUNNER_TEMP/fixtures/star_index" \
                --gtf        "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
                --outdir     "$RUNNER_TEMP/out_glob" \
                -ansi-log false 2>&1 | grep -cE 'Submitted process > RNASEQ:FASTQC' || true)
          echo "FASTQC tasks for 4 paired samples: $n"
          [ "$n" = "4" ]

      # An optional analysis that cannot run has to say so. Isoform switching is
      # gated at analysis level 3 and --stop_at postQC stops at level 2, so this
      # combination produces nothing; before 2026-10-30 it produced nothing
      # silently, with the run exiting 0 and the analysis simply absent.
      #
      # It was --stop_at DE here until 2026-10-31, when isoform switching moved
      # from level 4 to level 3 and that combination started producing output,
      # which the next step now asserts.
      - name: An analysis dropped by --stop_at says so
        run: |
          nextflow run main.nf -profile test -stub-run \
            --input            "$RUNNER_TEMP/fixtures/samplesheet.csv" \
            --aligner          salmon \
            --salmon_index     "$RUNNER_TEMP/fixtures/salmon_index" \
            --gtf              "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
            --transcript_fasta "$RUNNER_TEMP/fixtures/transcripts.fa.gz" \
            --isoform_switch \
            --stop_at          postQC \
            --outdir           "$RUNNER_TEMP/out_m6" \
            -ansi-log false 2>&1 | tee m6.log
          grep -q "runs at analysis level 3" m6.log
          if [ -d "$RUNNER_TEMP/out_m6/isoform_switch_output" ]; then
            echo "isoform_switch_output exists on a run stopped below its level"
            exit 1
          fi

      # The mirror of it, and the regression test for the level move: isoform
      # switching is a transcript-usage analysis like DTU, so --stop_at DE has
      # to reach it rather than stop one gate short of it.
      - name: Isoform switching runs at analysis level 3
        run: |
          nextflow run main.nf -profile test -stub-run \
            --input            "$RUNNER_TEMP/fixtures/samplesheet.csv" \
            --aligner          salmon \
            --salmon_index     "$RUNNER_TEMP/fixtures/salmon_index" \
            --gtf              "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
            --transcript_fasta "$RUNNER_TEMP/fixtures/transcripts.fa.gz" \
            --isoform_switch \
            --stop_at          DE \
            --outdir           "$RUNNER_TEMP/out_isoform3"
          if [ ! -d "$RUNNER_TEMP/out_isoform3/isoform_switch_output" ]; then
            echo "isoform_switch_output missing on a --stop_at DE run that asked for it"
            ls -1 "$RUNNER_TEMP/out_isoform3"
            exit 1
          fi

      # The samplesheet validator has to refuse a condition make.names() would
      # rewrite, before any work starts. "TGF-beta" is the condition name in
      # the paper this pipeline's own human example is built on.
      - name: Invalid R name in a condition is refused
        run: |
          sed 's/,TREAT$/,TGF-beta/' "$RUNNER_TEMP/fixtures/samplesheet.csv" > bad.csv
          if nextflow run main.nf -profile test -stub-run \
               --input      bad.csv \
               --aligner    star \
               --star_index "$RUNNER_TEMP/fixtures/star_index" \
               --gtf        "$RUNNER_TEMP/fixtures/genome.gtf.gz" \
               --outdir     "$RUNNER_TEMP/out_badname" \
               -ansi-log false 2>&1 | tee badname.log; then
            echo "run succeeded with a condition DESeq2 cannot name"
            exit 1
          fi
          grep -q "not valid R names" badname.log

      # The same check one column further in. A covariate introduced through
      # --design had its column checked for existence and its values checked
      # for nothing, so a timepoint of '6h' reached resultsNames() as
      # 'timepointX6h'. --validate_only stops before any process, which is all
      # this needs.
      - name: Invalid R name in a design covariate is refused
        run: |
          awk 'NR==1 {print $0 ",timepoint"; next} {print $0 ",6h"}' \
            "$RUNNER_TEMP/fixtures/samplesheet.csv" > timepoint.csv
          if nextflow run main.nf -profile test -stub-run --validate_only \
               --input        timepoint.csv \
               --design       '~ timepoint + condition' \
               --aligner      hisat2 \
               --hisat2_index "$RUNNER_TEMP/fixtures/hisat2_index" \
               --outdir       "$RUNNER_TEMP/out_badcovariate" \
               -ansi-log false 2>&1 | tee badcovariate.log; then
            echo "run succeeded with a timepoint DESeq2 would rename"
            exit 1
          fi
          grep -q "timepoint '6h'" badcovariate.log
